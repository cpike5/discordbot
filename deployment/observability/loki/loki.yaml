# Loki — single-binary, filesystem storage. Logs arrive on the OTLP endpoint (/otlp/v1/logs).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn
  # Log lines carry exception details as structured metadata; the 4 MB default is too small for
  # a page of them and the query hangs until it times out.
  grpc_server_max_recv_msg_size: 67108864
  grpc_server_max_send_msg_size: 67108864

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 720h          # 30 days
  allow_structured_metadata: true # OTLP log attributes (trace_id, SourceContext, ...) land here
  volume_enabled: true
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_query_series: 5000
  otlp_config:
    resource_attributes:
      attributes_config:
        # service.name, deployment.environment etc. are indexed by default; add the instance.
        - action: index_label
          attributes:
            - service.instance.id

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

pattern_ingester:
  enabled: true

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

ruler:
  alertmanager_url: ""

analytics:
  reporting_enabled: false
