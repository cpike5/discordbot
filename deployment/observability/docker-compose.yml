# Grafana observability stack — Grafana, Loki, Tempo, Prometheus, OpenTelemetry Collector
#
# The bot pushes logs, traces and metrics over OTLP to the collector, which fans them out:
#   logs    -> Loki        (OTLP native endpoint)
#   traces  -> Tempo       (OTLP gRPC), Tempo's metrics-generator -> Prometheus (service graph, span metrics)
#   metrics -> Prometheus  (OTLP native receiver)
#
# Usage (from the repository root):
#   docker compose -f deployment/observability/docker-compose.yml up -d
#
# The stack creates the shared Docker network "observability". Any container attached to it
# (the bot's docker-compose.yml joins it) reaches the collector at otel-collector:4317 (gRPC)
# or otel-collector:4318 (HTTP). Start this stack before the bot so the network exists.
#
# Grafana runs with anonymous access (Editor role by default, so Explore and dashboard edits work without
# a login). Do not expose port 3000 to the internet as is: put it behind a reverse proxy with auth,
# or set GF_ANONYMOUS_ROLE=Viewer. See README.md in this directory.

name: discordbot-observability

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ===========================================================================
  # OpenTelemetry Collector — the single OTLP entry point
  # ===========================================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"   # OTLP gRPC (for a bot running on the host)
      - "${OTLP_HTTP_PORT:-4318}:4318"   # OTLP HTTP
    networks: [observability]
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - loki
      - tempo
      - prometheus

  # ===========================================================================
  # Prometheus — metrics store (OTLP receiver + remote-write receiver for Tempo)
  # ===========================================================================
  prometheus:
    image: quay.io/prometheus/prometheus:v3.6.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
      - --enable-feature=exemplar-storage
      - --enable-feature=native-histograms
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [observability]
    restart: unless-stopped
    logging: *default-logging

  # ===========================================================================
  # Loki — log store
  # ===========================================================================
  loki:
    image: grafana/loki:3.5.5
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks: [observability]
    restart: unless-stopped
    logging: *default-logging

  # ===========================================================================
  # Tempo — trace store
  # ===========================================================================
  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    user: "0"   # the image runs as uid 10001, which cannot write a fresh named volume
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks: [observability]
    restart: unless-stopped
    logging: *default-logging

  # ===========================================================================
  # Grafana — anonymous access, provisioned data sources and dashboards
  # ===========================================================================
  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: ${GF_ANONYMOUS_ROLE:-Editor}
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GF_ROOT_URL:-http://localhost:3000}
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor,traceToMetrics
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/discordbot-overview.json
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks: [observability]
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:

networks:
  observability:
    name: observability
    driver: bridge
