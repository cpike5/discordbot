# Prometheus — the bot's metrics arrive by OTLP push (via the collector), not by scraping.
# The scrape jobs below cover the stack's own components.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

# OTLP ingestion: copy these resource attributes onto every series as labels, so dashboards can
# filter by environment and instance without joining against target_info.
otlp:
  promote_resource_attributes:
    - service.name
    - service.instance.id
    - deployment.environment
  keep_identifying_resource_attributes: true

storage:
  tsdb:
    out_of_order_time_window: 30m

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
