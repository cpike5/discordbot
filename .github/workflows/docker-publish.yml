name: Docker Publish

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker-build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Resolve release tag
      id: release_tag
      run: |
        # workflow_run carries the triggering tag in head_branch; fall back to github.ref for direct triggers
        TAG="${{ github.event.workflow_run.head_branch }}"
        if [[ -z "$TAG" || "$TAG" != v* ]]; then
          TAG="${GITHUB_REF#refs/tags/}"
        fi
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "Resolved tag: $TAG"

    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}},value=${{ steps.release_tag.outputs.tag }}
          type=semver,pattern={{major}}.{{minor}},value=${{ steps.release_tag.outputs.tag }}
          type=raw,value=latest,enable=${{ !contains(steps.release_tag.outputs.tag, '-') }}
        labels: |
          org.opencontainers.image.title=Discord Bot Management System
          org.opencontainers.image.description=Discord bot with admin UI, audio features, and management tools
          org.opencontainers.image.vendor=cpike5

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: ${{ github.event_name == 'workflow_run' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64

    - name: Verify pushed image
      if: github.event_name == 'workflow_run'
      run: |
        echo "### Docker Image Published :whale:" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Registry:** ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
        echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
        echo '${{ steps.meta.outputs.tags }}' | while read -r tag; do
          echo "- \`${tag}\`" >> $GITHUB_STEP_SUMMARY
        done
