<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1114" />
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg" />
    <title>Offline - Discord Bot Admin</title>
    <!-- Self-contained on purpose: this page is served by the service worker when the
         network is down, so it cannot depend on anything that is not precached. -->
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: #0f1114;
            color: #e8e9ec;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        main { max-width: 26rem; text-align: center; }
        img { width: 72px; height: 72px; margin-bottom: 1.5rem; }
        h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
        p { margin: 0 0 1.5rem; color: #a3a7b0; line-height: 1.5; }
        button {
            font: inherit;
            font-weight: 600;
            padding: 0.625rem 1.25rem;
            border: 0;
            border-radius: 0.5rem;
            background: #5865f2;
            color: #fff;
            cursor: pointer;
        }
        button:hover { background: #4752c4; }
        button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    </style>
</head>
<body>
    <main>
        <img src="/images/logo.svg" alt="" />
        <h1>You're offline</h1>
        <p>The admin portal needs a connection to the bot. Check your network and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
        window.addEventListener('online', function () { location.reload(); });
    </script>
</body>
</html>
