# Discord Bot Management System — Docker Compose
#
# Usage:
#   docker compose up -d                                    # Bot + SQLite (default)
#   docker compose --profile postgres up -d                 # Bot + PostgreSQL
#   docker compose --profile seq up -d                      # Bot + Seq logging
#   docker compose --profile postgres --profile seq up -d   # Everything
#
# PostgreSQL workflow:
#   1. Copy .env.example to .env and set DATABASE_PROVIDER=PostgreSql
#   2. Set CONNECTION_STRING to the PostgreSQL connection string (use 'postgres' as hostname)
#   3. Set POSTGRES_USER and POSTGRES_PASSWORD to match the connection string
#   4. Run: docker compose --profile postgres up -d

services:
  # ===========================================================================
  # Bot (always starts)
  # ===========================================================================
  bot:
    build: .
    env_file: .env
    networks:
      - elastic-network
      - db-network
    environment:
      Observability__SeqUrl: ${SEQ_URL:-}
      Database__Provider: ${DATABASE_PROVIDER:-}
      ConnectionStrings__DefaultConnection: ${CONNECTION_STRING:-Data Source=data/discordbot.db}
      DmAssistant__Model: ${DmAssistant__Model:-}
      DmAssistant__EnableCodeExecution: ${DmAssistant__EnableCodeExecution:-false}
    volumes:
      - bot-data:/app/data            # SQLite database persistence
      - ./sounds:/app/sounds:ro       # Optional: custom sound clips
    ports:
      - "7300:5000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      seq:
        condition: service_healthy
        required: false

  # ===========================================================================
  # PostgreSQL (--profile postgres)
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    #profiles: [postgres]
    networks:
      - db-network
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-discordbot}
      POSTGRES_USER: ${POSTGRES_USER:-discordbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "7302:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-discordbot} -d ${POSTGRES_DB:-discordbot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Seq (--profile seq)
  # ===========================================================================
  seq:
    image: datalust/seq:latest
    networks:
      - seq-network
    profiles: [seq]
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD:-}
      SEQ_FIRSTRUN_NOAUTHENTICATION: ${SEQ_NO_AUTH:-true}
    volumes:
      - seq-data:/data
    ports:
      - "7301:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bot-data:
  postgres-data:
  seq-data:

networks:
  elastic-network:
    external: true
  db-network:
    external: false
  seq-network:
    external: false
